name: Python CI/CD to Azure Web App
on:
  workflow_dispatch:

jobs:
  # =========================
  # BUILD STAGE
  # =========================
  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
    
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Run Bash command
        run: |
          echo "Hello from Bash"
          pwd
          ls -la
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Build Docker image and save as artifact
      - name: Build Docker image
        run: |
          docker build -t python-hello:v.0.1 .

      - name: Save Docker image to tar
        run: |
          docker save python-hello:latest -o python-hello.tar

      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-hello-image
          path: python-hello.tar
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

