name: Python CI/CD to Azure Web App
on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Docker image tag/version (e.g. v0.1 or 1.0.0)'
        required: false
        default: 'v.0.1'

jobs:
  # =========================
  # BUILD STAGE
  # =========================
  build:
    name: Build Python Application
    runs-on: ubuntu-latest
    env:
     acrname: testacrdocker.azurecr.io
     IMAGE_TAG: ${{ github.event.inputs.image_version }}

    steps:
    
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Run Bash command
        run: |
          echo "Hello from Bash"
          pwd
          ls -la
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Build Docker image and save as artifact
      - name: Build Docker image
        run: |
          docker build -t ${{ env.acrname }}/python-hello:${{ env.IMAGE_TAG }} .
          echo "${{ secrets.ACR_CLIENTSECRET }}" | docker login ${{ env.acrname }} --username ${{ secrets.ACR_CLIENTID }} --password-stdin
          docker push ${{ env.acrname }}/python-hello:${{ env.IMAGE_TAG }}

      - name: Save Docker image to tar
        run: |
          docker save ${{ env.acrname }}/python-hello:${{ env.IMAGE_TAG }} -o python-hello-${{ env.IMAGE_TAG }}.tar

      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-hello-image-${{ env.IMAGE_TAG }}
          path: python-hello-${{ env.IMAGE_TAG }}.tar
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

